# docker compose up --build      ->  API on http://localhost:8000/docs, dashboard on :8501
#
# The image holds code and dependencies only. Data, trained models and the recommender
# index are mounted from this folder, so create them first (locally or in a container):
#   python run.py data && python run.py train && python run.py index
services:
  api:
    build: .
    image: sap-incident-forecasting:latest
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      CHROMA_DIR: /app/results/chroma
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  dashboard:
    build: .                     # same image as the api (cache hit); avoids a registry pull
    image: sap-incident-forecasting:latest
    command: streamlit run src/dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./results:/app/results
    depends_on:
      api:
        condition: service_healthy
